version: '3.8'

services:
  bella:
    # Nutze das bereits gebaute Image von Docker Hub
    image: L8teNever/bella:latest
    container_name: bella-backup-system
    hostname: bella

    # Ports
    ports:
      - "5000:5000"

    # Volumes
    volumes:
      # Docker Socket für Docker-in-Docker Zugriff
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistente Datenbank
      - bella-db:/app/data
      # Backup-Speicher
      - bella-backups:/backups

    # Environment
    environment:
      - BACKUP_DIR=/backups
      - DATABASE_PATH=/app/data/bella.db
      - BACKUP_TIME=01:00
      - TZ=Europe/Berlin
      - FLASK_ENV=production
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000

    # Restart Policy
    restart: always

    # Health Check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Volumes
volumes:
  bella-db:
    name: bella-database
    driver: local
  bella-backups:
    name: bella-backup-storage
    driver: local

# Networks (optional)
networks:
  default:
    name: bella-network
