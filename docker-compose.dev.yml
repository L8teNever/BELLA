services:
  docker-backup-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-backup-manager-dev
    ports:
      - "8000:8000"
    volumes:
      # Mount Docker socket for container access
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount source code for development
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
      # Mount backup directory for persistent storage
      - ./backups:/app/backups
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      - DEBUG=True
      - BACKUP_RETENTION_DAYS=30
      - SCHEDULER_TIMEZONE=UTC
    restart: unless-stopped
    networks:
      - docker-backup-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

networks:
  docker-backup-network:
    driver: bridge
