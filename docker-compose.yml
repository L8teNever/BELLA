version: '3.8'

services:
  bella:
    image: l8tenever/bella:latest
    container_name: bella-backup-system
    ports:
      - "5000:5000"
    volumes:
      # Docker Socket for Docker-in-Docker access
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent database
      - bella-db:/app/data
      # Backup storage
      - bella-backups:/backups
    environment:
      - BACKUP_DIR=/backups
      - DATABASE_PATH=/app/data/bella.db
      - BACKUP_TIME=01:00
      - TZ=Europe/Berlin
      - FLASK_ENV=production
    restart: unless-stopped

volumes:
  bella-db:
    name: bella-database
  bella-backups:
    name: bella-backup-storage
