version: '3.8'

services:
  docker-backup-manager:
    build: .
    container_name: docker-backup-manager
    ports:
      - "8000:8000"
    volumes:
      # Mount Docker socket for container access
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount backup directory for persistent storage
      - ./backups:/app/backups
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      - DEBUG=False
      - BACKUP_RETENTION_DAYS=30
      - SCHEDULER_TIMEZONE=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - docker-backup-network

networks:
  docker-backup-network:
    driver: bridge
