version: '3.8'

services:
  bella-watcher:
    image: l8tenever/bella:latest
    container_name: bella-watcher
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/hostfs:ro # Read-only access to host for backup
      - ./backups:/app/backups # Store zip files here
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
