<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Watcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --header-bg: rgba(15, 23, 42, 0.8);
            --status-running: #22c55e;
            --status-exited: #ef4444;
            --status-paused: #eab308;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .background-blob {
            position: fixed;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.2;
            pointer-events: none;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: #3b82f6;
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: #a855f7;
            bottom: -150px;
            right: -150px;
            border-radius: 50%;
        }

        header {
            padding: 2rem;
            text-align: center;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            margin: 0;
            letter-spacing: -0.025em;
            font-weight: 600;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container-list {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .container-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .container-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .container-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-running {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .status-exited {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .status-paused {
            background: rgba(234, 179, 8, 0.2);
            color: #fbbf24;
        }

        .status-other {
            background: rgba(148, 163, 184, 0.2);
            color: #94a3b8;
        }

        .image-name {
            font-size: 0.875rem;
            opacity: 0.6;
            word-break: break-all;
            margin-bottom: 0.5rem;
        }

        .container-id {
            font-family: monospace;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            margin-top: 0.5rem;
            display: inline-block;
        }

        .uptime {
            font-size: 0.75rem;
            margin-top: 1rem;
            opacity: 0.5;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .mounts-section {
            margin-top: 1rem;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.8rem;
            border-radius: 0.5rem;
        }

        .mounts-section ul {
            margin: 0.5rem 0 0 0;
            padding-left: 1.2rem;
            list-style: none;
        }

        .mounts-section li {
            margin-bottom: 0.4rem;
            word-break: break-all;
            opacity: 0.8;
            position: relative;
        }

        .mounts-section li::before {
            content: '→';
            position: absolute;
            left: -1.2rem;
            color: var(--accent-color);
        }

        .path-label {
            color: var(--accent-color);
            font-weight: 600;
        }

        .compose-toggle {
            margin-top: 1rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            border: none;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .compose-toggle:hover {
            opacity: 0.9;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #1e293b;
            margin: 5% auto;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 80%;
            max-width: 800px;
            border-radius: 1rem;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-modal {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        pre {
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.5rem;
            color: #4ade80;
            font-family: 'Consolas', monospace;
            overflow-x: auto;
        }

        .loading {
            text-align: center;
            margin-top: 5rem;
            font-size: 1.25rem;
        }

        @media (max-width: 450px) {
            .container-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>

    <header>
        <h1>Docker Watcher Dashboard</h1>
        <button id="view-compose-btn" class="compose-toggle">Docker Compose anzeigen</button>
    </header>

    <div id="compose-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>docker-compose.yml</h2>
            <pre id="compose-content"></pre>
        </div>
    </div>

    <main id="app">
        <div id="loading" class="loading">Suchen nach Containern...</div>
        <div id="container-list" class="container-list" style="display: none;"></div>
    </main>

    <script>
        // Modal Logic
        const modal = document.getElementById("compose-modal");
        const btn = document.getElementById("view-compose-btn");
        const span = document.getElementsByClassName("close-modal")[0];

        btn.onclick = async function () {
            try {
                const res = await fetch('/api/compose-config');
                const data = await res.json();
                document.getElementById('compose-content').textContent = data.content;
                modal.style.display = "block";
            } catch (e) {
                alert("Fehler beim Laden der Compose-Datei");
            }
        }

        span.onclick = function () { modal.style.display = "none"; }
        window.onclick = function (event) {
            if (event.target == modal) { modal.style.display = "none"; }
        }

        async function fetchContainers() {
            try {
                const response = await fetch('/api/containers');
                const containers = await response.json();

                if (containers.error) {
                    console.error('Error fetching containers:', containers.error);
                    return;
                }

                renderContainers(containers);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('container-list').style.display = 'grid';
            } catch (error) {
                console.error('Failed to fetch containers:', error);
            }
        }

        function renderContainers(containers) {
            const list = document.getElementById('container-list');
            list.innerHTML = '';

            containers.forEach(container => {
                const card = document.createElement('div');
                card.className = 'container-card';

                const statusClass = `status-${container.status.toLowerCase()}` || 'status-other';

                let mountsHtml = '';
                if (container.mounts && container.mounts.length > 0) {
                    mountsHtml = '<div class="mounts-section"><strong>Mounts/Paths:</strong><ul>';
                    container.mounts.forEach(m => {
                        mountsHtml += `<li><span class="path-label">Host:</span> ${m.source} <br> <span class="path-label">Container:</span> ${m.destination}</li>`;
                    });
                    mountsHtml += '</ul></div>';
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span class="container-name">${container.name}</span>
                        <span class="status-badge ${statusClass}">${container.status}</span>
                    </div>
                    <div class="image-name">${container.image}</div>
                    <div class="container-id">ID: ${container.id}</div>
                    ${mountsHtml}
                    <div class="uptime">
                        <span>Started: ${new Date(container.uptime).toLocaleString()}</span>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // Initial fetch
        fetchContainers();
        // Poll every 5 seconds
        setInterval(fetchContainers, 5000);
    </script>
</body>

</html>
