<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Watcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --header-bg: rgba(15, 23, 42, 0.8);
            --status-running: #22c55e;
            --status-exited: #ef4444;
            --status-paused: #eab308;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .background-blob {
            position: fixed;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.2;
            pointer-events: none;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: #3b82f6;
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: #a855f7;
            bottom: -150px;
            right: -150px;
            border-radius: 50%;
        }

        header {
            padding: 2rem;
            text-align: center;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            margin: 0;
            letter-spacing: -0.025em;
            font-weight: 600;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container-list {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .container-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .container-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .container-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-running {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .status-exited {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .status-paused {
            background: rgba(234, 179, 8, 0.2);
            color: #fbbf24;
        }

        .status-other {
            background: rgba(148, 163, 184, 0.2);
            color: #94a3b8;
        }

        .image-name {
            font-size: 0.875rem;
            opacity: 0.6;
            word-break: break-all;
            margin-bottom: 0.5rem;
        }

        .container-id {
            font-family: monospace;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            margin-top: 0.5rem;
            display: inline-block;
        }

        .uptime {
            font-size: 0.75rem;
            margin-top: 1rem;
            opacity: 0.5;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-section {
            margin-top: 1rem;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.8rem;
            border-radius: 0.5rem;
        }

        .info-section ul {
            margin: 0.5rem 0 0 0;
            padding-left: 1.2rem;
            list-style: none;
        }

        .info-section li {
            margin-bottom: 0.4rem;
            word-break: break-all;
            opacity: 0.8;
            position: relative;
        }

        .info-section li::before {
            content: '→';
            position: absolute;
            left: -1.2rem;
            color: var(--accent-color);
        }

        .compose-info {
            background: rgba(56, 189, 248, 0.05);
            border-left: 3px solid var(--accent-color);
        }

        .compose-item {
            margin-top: 0.3rem;
            opacity: 0.8;
        }

        .path-label {
            color: var(--accent-color);
            font-weight: 600;
        }

        .loading {
            text-align: center;
            margin-top: 5rem;
            font-size: 1.25rem;
        }

        @media (max-width: 450px) {
            .container-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>

    <header>
        <h1>Docker Watcher Dashboard</h1>
        <div class="header-actions" style="margin-top: 1rem; display: flex; gap: 1rem; justify-content: center;">
            <button id="show-containers-btn" class="compose-toggle active">Container</button>
            <button id="show-backups-btn" class="compose-toggle">Backups</button>
        </div>
    </header>

    <main id="app">
        <!-- Containers View -->
        <div id="containers-view">
            <div class="action-bar" style="text-align: right; max-width: 1200px; margin: 1rem auto; padding: 0 2rem;">
                <button id="backup-selected-btn" class="compose-toggle" disabled
                    style="background: linear-gradient(to right, #22c55e, #10b981);">Ausgewählte Backupen</button>
            </div>

            <div id="loading-containers" class="loading">Suchen nach Containern...</div>
            <div id="container-list" class="container-list" style="display: none;"></div>
        </div>

        <!-- Backups View -->
        <div id="backups-view" style="display: none;">
            <div class="action-bar" style="text-align: right; max-width: 1200px; margin: 1rem auto; padding: 0 2rem;">
                <label for="restore-upload" class="compose-toggle"
                    style="cursor:pointer; display:inline-block; background: linear-gradient(to right, #a855f7, #d946ef);">Backup
                    hochladen & Wiederherstellen</label>
                <input type="file" id="restore-upload" accept=".zip" style="display:none;"
                    onchange="uploadBackup(event)">
            </div>

            <div id="loading-backups" class="loading">Lade Backups...</div>
            <div id="backup-list" class="container-list" style="display: none;"></div>
        </div>
    </main>

    <!-- Backup Modal -->
    <div id="backup-modal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <span class="close-modal" id="close-backup-modal">&times;</span>
            <h2>Backup Starten</h2>
            <p style="margin-bottom: 2rem;">Sollen die ausgewählten Container jetzt gesichert werden oder nach Zeitplan?
            </p>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <button class="compose-toggle" style="margin: 0;" onclick="triggerManualBackup()">Jetzt
                    Backupen</button>
                <div
                    style="display: flex; gap: 0.5rem; justify-content: center; align-items: center; margin-top: 1rem;">
                    <input type="time" id="backup-time"
                        style="padding: 0.5rem; border-radius: 0.25rem; border: none; background: #0f172a; color: white;">
                    <button class="compose-toggle" style="margin: 0;" onclick="scheduleBackup()">Zeitplan
                        erstellen</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedContainers = new Set();

        // Navigation Logic
        const containersBtn = document.getElementById('show-containers-btn');
        const backupsBtn = document.getElementById('show-backups-btn');
        const containersView = document.getElementById('containers-view');
        const backupsView = document.getElementById('backups-view');

        containersBtn.onclick = () => {
            containersBtn.style.opacity = '1';
            backupsBtn.style.opacity = '0.5';
            containersView.style.display = 'block';
            backupsView.style.display = 'none';
        };

        backupsBtn.onclick = () => {
            backupsBtn.style.opacity = '1';
            containersBtn.style.opacity = '0.5';
            containersView.style.display = 'none';
            backupsView.style.display = 'block';
            fetchBackups();
        };

        // Modal Logic
        const backupModal = document.getElementById("backup-modal");
        const backupSelectedBtn = document.getElementById("backup-selected-btn");
        const closeBackupModal = document.getElementById("close-backup-modal");

        backupSelectedBtn.onclick = () => { backupModal.style.display = "block"; }
        closeBackupModal.onclick = () => { backupModal.style.display = "none"; }
        window.onclick = (event) => { if (event.target == backupModal) { backupModal.style.display = "none"; } }

        function toggleSelection(containerId, containerName) {
            const strValue = JSON.stringify([containerId, containerName]);
            if (selectedContainers.has(strValue)) {
                selectedContainers.delete(strValue);
            } else {
                selectedContainers.add(strValue);
            }
            backupSelectedBtn.disabled = selectedContainers.size === 0;
            if (selectedContainers.size === 0) {
                backupSelectedBtn.style.opacity = '0.5';
                backupSelectedBtn.style.cursor = 'not-allowed';
            } else {
                backupSelectedBtn.style.opacity = '1';
                backupSelectedBtn.style.cursor = 'pointer';
            }
        }

        async function triggerManualBackup() {
            const containers = Array.from(selectedContainers).map(JSON.parse);
            try {
                const res = await fetch('/api/backup/manual', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ containers })
                });
                const data = await res.json();
                alert(data.message || 'Backup gestartet');
                backupModal.style.display = "none";
                selectedContainers.clear();
                toggleSelection('', ''); // reset button state
                fetchContainers();
            } catch (e) {
                alert("Fehler beim Starten des Backups");
            }
        }

        async function scheduleBackup() {
            const time = document.getElementById('backup-time').value;
            if (!time) return alert("Bitte wähle eine Zeit aus.");

            const containers = Array.from(selectedContainers).map(JSON.parse);
            try {
                const res = await fetch('/api/backup/schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ containers, time })
                });
                const data = await res.json();
                alert(data.message || 'Zeitplan erstellt');
                backupModal.style.display = "none";
                selectedContainers.clear();
                toggleSelection('', ''); // reset button state
                fetchContainers();
            } catch (e) {
                alert("Fehler beim Erstellen des Zeitplans");
            }
        }

        async function uploadBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                alert("Lade hoch und entpacke... Das kann einen Moment dauern.");
                const res = await fetch('/api/restore', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                alert(data.message || data.error);
                fetchBackups();
            } catch (e) {
                alert("Ein Fehler ist beim Restore aufgetreten.");
            }
        }

        async function fetchContainers() {
            try {
                const response = await fetch('/api/containers');
                const containers = await response.json();

                if (containers.error) {
                    console.error('Error fetching containers:', containers.error);
                    return;
                }

                renderContainers(containers);
                document.getElementById('loading-containers').style.display = 'none';
                document.getElementById('container-list').style.display = 'grid';
            } catch (error) {
                console.error('Failed to fetch containers:', error);
            }
        }

        async function fetchBackups() {
            try {
                const response = await fetch('/api/backups');
                const backups = await response.json();
                renderBackups(backups);
                document.getElementById('loading-backups').style.display = 'none';
                document.getElementById('backup-list').style.display = 'grid';
            } catch (error) {
                console.error('Failed to fetch backups:', error);
            }
        }

        function renderBackups(backups) {
            const list = document.getElementById('backup-list');
            list.innerHTML = '';

            if (backups.length === 0) {
                list.style.display = 'block';
                list.innerHTML = '<div style="text-align: center; opacity: 0.5;">Keine Backups gefunden.</div>';
                return;
            }

            backups.forEach(backup => {
                const item = document.createElement('div');
                item.className = 'container-card';
                item.innerHTML = `
                    <div class="card-header">
                        <span class="container-name" style="word-break: break-all;">${backup.name}</span>
                    </div>
                    <div class="status-badge status-other" style="display: inline-block; margin-bottom: 1rem;">${backup.size_mb} MB</div>
                    <div class="uptime">Erstellt am: ${new Date(backup.date).toLocaleString()}</div>
                `;
                list.appendChild(item);
            });
        }

        function renderContainers(containers) {
            const list = document.getElementById('container-list');
            list.innerHTML = '';

            // Keep selection state across refreshes
            const selectedSet = new Set(Array.from(selectedContainers));

            containers.forEach(container => {
                const card = document.createElement('div');
                card.className = 'container-card';
                card.id = `card-${container.id}`;

                const strValue = JSON.stringify([container.id, container.name]);

                const statusClass = `status-${container.status.toLowerCase()}` || 'status-other';

                let mountsHtml = '';
                if (container.mounts && container.mounts.length > 0) {
                    mountsHtml = '<div class="info-section"><strong>Mounts:</strong><ul>';
                    container.mounts.forEach(m => {
                        mountsHtml += `<li><span class="path-label">Host:</span> ${m.source} <br> <span class="path-label">Container:</span> ${m.destination}</li>`;
                    });
                    mountsHtml += '</ul></div>';
                }

                let composeHtml = '';
                if (container.compose && container.compose.project !== 'N/A') {
                    composeHtml = `
                        <div class="info-section compose-info">
                            <strong>Compose Config:</strong>
                            <div class="compose-item"><span class="path-label">Projekt:</span> ${container.compose.project}</div>
                            <div class="compose-item"><span class="path-label">Service:</span> ${container.compose.service}</div>
                            <div class="compose-item"><span class="path-label">Arbeitsverz.:</span> ${container.compose.working_dir}</div>
                            <div class="compose-item"><span class="path-label">Config-Dateien:</span> ${container.compose.config_files}</div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div style="position: absolute; top: 1.5rem; right: 1.5rem; z-index: 5;">
                        <input type="checkbox" style="width: 1.2rem; height: 1.2rem; cursor: pointer; accent-color: var(--accent-color);" 
                               ${selectedSet.has(strValue) ? 'checked' : ''}
                               onchange="toggleSelection('${container.id}', '${container.name}')">
                    </div>
                    <div class="card-header" style="margin-right: 2.5rem;">
                        <span class="container-name">${container.name}</span>
                        <span class="status-badge ${statusClass}">${container.status}</span>
                    </div>
                    <div class="image-name">${container.image}</div>
                    <div class="container-id">ID: ${container.id}</div>
                    ${composeHtml}
                    ${mountsHtml}
                    <div class="uptime">
                        <span>Started: ${new Date(container.uptime).toLocaleString()}</span>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // Initialize UI states
        document.getElementById('show-backups-btn').style.opacity = '0.5';
        toggleSelection('', ''); // initialize disabled state for backup button

        // Initial fetch
        fetchContainers();

        // Poll every 5 seconds, but only if container view is active to avoid resetting selections annoyingly
        setInterval(() => {
            if (containersView.style.display !== 'none') {
                fetchContainers();
            }
        }, 5000);
    </script>
</body>

</html>
