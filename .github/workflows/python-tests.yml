name: Python Syntax & Quality Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pylint

      - name: Check Python syntax
        run: |
          echo "Checking Python syntax..."
          find app -name "*.py" -exec python -m py_compile {} \;
          echo "[OK] All Python files have valid syntax"

      - name: Lint with Flake8
        run: |
          echo "Running Flake8 linter..."
          flake8 app --max-line-length=120 --exclude=__pycache__ || true
          echo "[WARN] Flake8 checks completed (warnings shown above)"

      - name: Check imports
        run: |
          echo "Checking imports..."
          python -c "import fastapi; import docker; import apscheduler; print('[OK] All imports successful')"

      - name: Verify project structure
        run: |
          echo "Verifying project structure..."
          test -d app && echo "[OK] app/" || exit 1
          test -f app/main.py && echo "[OK] app/main.py" || exit 1
          test -f requirements.txt && echo "[OK] requirements.txt" || exit 1
          test -f Dockerfile && echo "[OK] Dockerfile" || exit 1
          test -f docker-compose.yml && echo "[OK] docker-compose.yml" || exit 1
          test -d templates && echo "[OK] templates/" || exit 1
          test -d static && echo "[OK] static/" || exit 1
          echo "[OK] Project structure verified"

      - name: Test complete
        run: |
          echo ""
          echo "[OK] All tests passed successfully!"
