# Docker Compose für Dockge Management
# Optimiert für Dockge Interface
#
# In Dockge nutzen:
# 1. New Project → From File
# 2. Diesen Inhalt einfügen
# 3. Create & Deploy

services:
  docker-backup-manager:
    image: ghcr.io/l8tenever/bella:latest
    pull_policy: always  # Immer aktuelles Image nutzen
    container_name: docker-backup-manager
    restart: unless-stopped

    # Ports für Web-Interface
    ports:
      - "8000:8000"

    # Volumes für Persistierung
    volumes:
      # Docker Socket für Container-Zugriff
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Backup-Daten (Named Volume)
      - backup-data:/app/backups
      # Logs (Named Volume)
      - log-data:/app/logs

    # Umgebungsvariablen
    environment:
      DEBUG: "False"
      BACKUP_RETENTION_DAYS: "30"
      SCHEDULER_TIMEZONE: "UTC"
      MAX_BACKUP_SIZE: "10737418240"  # 10GB
      COMPRESS_LEVEL: "6"

    # Health Check für Dockge Überwachung
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

# Named Volumes für persistente Daten
volumes:
  backup-data:
    driver: local
  log-data:
    driver: local
